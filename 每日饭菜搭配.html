<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日饭菜搭配 - 早中晚三餐科学搭配</title>
<style>
  :root {
    --bg: #f3f1ed;
    --card-bg: #ffffff;
    --card-bg-warm: #fffdfa;
    --morning: #ff9a56;
    --morning-light: #fff5ed;
    --noon: #4caf7c;
    --noon-light: #f0faf3;
    --night: #6c7dd0;
    --night-light: #f2f3fb;
    --text: #2d2a28;
    --text-light: #7a7570;
    --border: rgba(0,0,0,0.05);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow: 0 2px 16px rgba(0,0,0,0.06);
    --shadow-lg: 0 4px 24px rgba(0,0,0,0.08);
    --radius: 20px;
    --radius-sm: 12px;
    --radius-xs: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #f5f3ef; color: var(--text); min-height: 100vh; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Bento Container ---- */
  .bento-wrap {
    max-width: 1100px; margin: 0 auto; padding: 20px 20px 36px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .bento-top {
    display: grid; grid-template-columns: 1fr 2fr; gap: 14px; align-items: start;
  }
  .bento-card {
    background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
    border: 1px solid var(--border); padding: 16px 18px; transition: box-shadow 0.2s;
  }
  .bento-card:hover { box-shadow: var(--shadow-lg); }
  .bento-card--bare {
    background: none; border: none; box-shadow: none; padding: 0; border-radius: 0;
  }
  .bento-card--bare:hover { box-shadow: none; }

  .header { text-align: center; padding: 10px 0 4px; }
  .header h1 {
    font-size: 1.8rem; font-weight: 700;
    background: linear-gradient(135deg, #e07b3c, #c06a30);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; letter-spacing: 1px;
  }
  .header .subtitle { color: var(--text-light); margin-top: 2px; font-size: 0.84rem; }

  /* ---- Diet Mode Selector ---- */
  .diet-bar {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .diet-pill {
    font-size: 0.72rem; padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(0,0,0,0.06);
    background: #fafaf8; cursor: pointer; user-select: none; transition: all 0.18s;
    color: #8b7e70; white-space: nowrap; font-weight: 500;
  }
  .diet-pill:hover { border-color: #c0b898; background: #fefdfa; }
  .diet-pill.active {
    background: #4caf7c; color: #fff; border-color: #4caf7c;
    box-shadow: 0 2px 8px rgba(76,175,124,0.25); font-weight: 700;
  }
  .diet-pill.active--muscle { background: #e07b3c; border-color: #e07b3c; box-shadow: 0 2px 8px rgba(224,123,60,0.3); }
  .diet-pill.active--vegan { background: #5a9a5a; border-color: #5a9a5a; box-shadow: 0 2px 8px rgba(90,154,90,0.25); }
  .diet-pill.active--spicy { background: #d04040; border-color: #d04040; box-shadow: 0 2px 8px rgba(208,64,64,0.25); }

  /* ---- Action Bar ---- */
  .action-bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .btn {
    padding: 8px 18px; border-radius: 50px; border: none; font-size: 0.84rem;
    font-weight: 600; cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #f0985c, #e07b3c); color: #fff;
    box-shadow: 0 4px 14px rgba(224, 123, 60, 0.35);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(224, 123, 60, 0.45); }
  .btn-outline { background: #fafaf8; color: var(--text); border: 1px solid rgba(0,0,0,0.06); }
  .btn-outline:hover { border-color: rgba(0,0,0,0.12); background: #fff; }
  .btn-weekly {
    background: #fafaf8; color: #6c7dd0; border: 1px solid #d4d8f2; font-weight: 600;
  }
  .btn-weekly:hover { border-color: #a0a8e0; background: #f8f8ff; }
  .btn-weekly.active { background: #eff1fb; border-color: #6c7dd0; color: #4856a0; box-shadow: 0 0 0 3px rgba(108,125,208,0.1); }

  /* ---- Calorie Summary ---- */
  .cal-summary {
    text-align: center; font-size: 0.82rem; color: var(--text-light);
    display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px;
  }
  .cal-summary strong { color: var(--text); font-size: 1rem; }
  .cal-summary .cal-tag {
    display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600;
  }
  .cal-tag--low { background: #e2f0e2; color: #3d7040; }
  .cal-tag--mid { background: #fef3d8; color: #8a6d30; }
  .cal-tag--high { background: #fde8e4; color: #c04030; }

  /* ---- View Toggle ---- */
  .view-toggle { display: flex; justify-content: center; gap: 0; padding: 0 20px 8px; }
  .view-toggle button {
    font-size: 0.8rem; padding: 6px 18px; border: 1px solid rgba(0,0,0,0.06); background: #fafaf8;
    cursor: pointer; font-weight: 600; color: #8b7e70; transition: all 0.15s;
  }
  .view-toggle button:first-child { border-radius: 20px 0 0 20px; }
  .view-toggle button:last-child { border-radius: 0 20px 20px 0; }
  .view-toggle button.active { background: #4caf7c; color: #fff; border-color: #4caf7c; }

  /* ---- Bento Meal Grid ---- */
  .meals-grid {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    grid-template-rows: auto auto;
    gap: 14px;
  }
  .meal-card {
    background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
    border: 1px solid var(--border); overflow: visible; transition: transform 0.2s, box-shadow 0.2s;
  }
  .meal-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  #cardMorning { grid-column: 1; grid-row: 1; }
  #cardNoon    { grid-column: 2; grid-row: 1; }
  #cardTreat   { grid-column: 3; grid-row: 1; }
  #cardNight   { grid-column: 1 / 4; grid-row: 2; }

  .meal-card__header {
    padding: 14px 18px; display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 1rem; border-radius: var(--radius) var(--radius) 0 0;
  }
  .meal-card__header .icon { font-size: 1.2rem; }
  .meal-card--morning .meal-card__header { background: var(--morning-light); color: #c05a20; border-bottom: 1px solid #ffe8d6; }
  .meal-card--noon    .meal-card__header { background: var(--noon-light);  color: #2e6b45; border-bottom: 1px solid #d0eed8; }
  .meal-card--night   .meal-card__header { background: var(--night-light); color: #4856a0; border-bottom: 1px solid #dde0f4; }
  .meal-card--treat   .meal-card__header { background: #fef5f8; color: #b05060; border-bottom: 1px solid #f8d4e0; }
  .meal-card__body { padding: 10px 16px 14px; }

  /* ---- 3D Flip ---- */
  .flip-row { perspective: 800px; margin: 6px 0; transition: margin 0.3s; }
  .flip-inner {
    position: relative; width: 100%;
    transition: transform 0.55s cubic-bezier(0.4,0,0.2,1), height 0.35s ease;
    transform-style: preserve-3d; cursor: pointer;
  }
  .flip-inner.flipped { transform: rotateY(180deg); }
  .flip-front, .flip-back {
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: var(--radius-sm); width: 100%;
  }
  .flip-front {
    display: flex; align-items: flex-start; padding: 10px 12px;
    background: #fefdfa; border: 1px dashed #f0ebe0;
    transition: border-color 0.2s, box-shadow 0.2s; position: relative;
  }
  .flip-row:hover .flip-front { border-color: #d8cfc0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .flip-front::after {
    content: "点击查看详情 ›"; position: absolute; right: 12px; top: 50%;
    transform: translateY(-50%); font-size: 0.7rem; color: #c5bdb0; white-space: nowrap;
    opacity: 0; transition: opacity 0.2s;
  }
  .flip-row:hover .flip-front::after { opacity: 1; }
  .flip-back {
    position: absolute; top: 0; left: 0; right: 0; transform: rotateY(180deg);
    background: #fafaf7; border: 1.5px solid #e8dfd3; padding: 12px 14px;
    overflow-y: auto; max-height: 260px;
  }
  .flip-back::-webkit-scrollbar { width: 4px; }
  .flip-back::-webkit-scrollbar-thumb { background: #d8cfc0; border-radius: 4px; }
  .detail-section { margin-bottom: 7px; }
  .detail-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 2px; }
  .detail-text { font-size: 0.8rem; color: var(--text); line-height: 1.5; }
  .detail-calories { display: inline-block; background: #fff3e8; color: #d06828; font-weight: 700; padding: 2px 10px; border-radius: 20px; font-size: 0.78rem; }
  .detail-steps { font-size: 0.78rem; color: #4a4a4a; line-height: 1.65; }
  .flip-back-hint { font-size: 0.65rem; color: #bbb; text-align: right; margin-top: 4px; }

  .dish-label { flex-shrink: 0; font-size: 0.75rem; font-weight: 700; padding: 2px 9px; border-radius: 20px; margin-right: 10px; margin-top: 1px; letter-spacing: 0.5px; }
  .dish-label--meat { background: #fde8e4; color: #c04030; }
  .dish-label--veggie { background: #e2f0e2; color: #3d7040; }
  .dish-label--soup { background: #e0ecfa; color: #3d5990; }
  .dish-label--staple { background: #fef3d8; color: #8a6d30; }
  .dish-label--main,.dish-label--bf { background: #ffe8d6; color: #c05a20; }
  .dish-label--dessert { background: #fce4ec; color: #b8485a; }
  .dish-label--drink { background: #e0f2f1; color: #2e7d5c; }

  .meal-card--treat .meal-card__header { background: #fef0f6; color: #b05060; border-bottom: 2px solid #f8d4e0; }

  .dish-name { font-size: 0.92rem; color: var(--text); line-height: 1.5; padding-right: 20px; }
  .dish-desc { font-size: 0.76rem; color: var(--text-light); margin-top: 1px; }
  .dish-cal-row { font-size: 0.7rem; color: #c06030; font-weight: 600; margin-top: 1px; }
  .placeholder { text-align: center; color: #c5bfb5; padding: 20px 0; font-size: 0.9rem; }

  /* ---- Weekly Planner ---- */
  .weekly-container { display: none; max-width: 1300px; margin: 0 auto; padding: 0 16px 36px; }
  .weekly-container.active { display: block; }
  .weekly-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .week-col {
    background: #fffef9; border-radius: 10px; border: 1px solid #e8dfd3;
    overflow: hidden; min-width: 0;
  }
  .week-col__header {
    text-align: center; padding: 8px 4px; font-weight: 700; font-size: 0.8rem;
    letter-spacing: 0.5px; border-bottom: 1px solid #f0ebe0;
  }
  .week-col__header.today { background: #fff8e8; color: #c06020; }
  .week-slot {
    padding: 6px 6px; border-bottom: 1px dashed #f0ebe0; cursor: pointer;
    min-height: 48px; transition: background 0.15s; position: relative;
  }
  .week-slot:last-child { border-bottom: none; }
  .week-slot:hover { background: #fdfaf5; }
  .week-slot.drag-over { background: #e8f5ea; border: 2px dashed #4caf7c; border-radius: 6px; }
  .week-slot.dragging { opacity: 0.4; }

  /* ---- Fridge match badge ---- */
  .fridge-badge {
    display: inline-block; font-size: 0.62rem; font-weight: 700; padding: 1px 7px;
    border-radius: 10px; margin-left: 6px; vertical-align: middle;
    background: #e8f5ea; color: #3d7040; border: 1px solid #a0d8a8;
    animation: badgePulse 0.5s ease;
  }
  @keyframes badgePulse {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ---- Slot reel animation ---- */
  .reel-stage {
    position: relative; overflow: hidden; border-radius: 0 0 var(--radius) var(--radius);
  }
  .reel-track {
    position: relative;
    transition: transform 0.9s cubic-bezier(0.05, 0.82, 0.15, 1);
    will-change: transform;
  }
  .reel-track.racing { transition: none; }
  .reel-item {
    padding: 9px 14px; text-align: center; font-size: 0.88rem;
    color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; border-bottom: 1px solid rgba(0,0,0,0.03);
    opacity: 0.55; transition: opacity 0.15s;
  }
  .reel-item.win { opacity: 1; font-weight: 700; color: #2e6b45; background: rgba(76,175,124,0.06); }
  .reel-mask {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: linear-gradient(180deg,
      #fff 0%, rgba(255,255,255,0) 28%,
      rgba(255,255,255,0) 72%, #fff 100%);
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .meal-card.settled { animation: settleIn 0.35s ease; }
  @keyframes settleIn {
    0% { transform: scale(1.03); box-shadow: 0 4px 24px rgba(76,175,124,0.25); }
    100% { transform: scale(1); box-shadow: var(--shadow); }
  }

  /* ---- Celebration glow ---- */
  .meal-card.celebrate {
    animation: celebrateGlow 0.8s ease-in-out;
    box-shadow: 0 0 20px rgba(76,200,120,0.4), 0 0 60px rgba(76,200,120,0.2);
    border-color: #4caf7c;
  }
  @keyframes celebrateGlow {
    0% { box-shadow: 0 0 0px rgba(76,200,120,0); border-color: var(--border); }
    30% { box-shadow: 0 0 30px rgba(76,200,120,0.5), 0 0 80px rgba(76,200,120,0.25); border-color: #4caf7c; }
    50% { box-shadow: 0 0 15px rgba(76,200,120,0.3); }
    70% { box-shadow: 0 0 28px rgba(76,200,120,0.4), 0 0 70px rgba(76,200,120,0.2); }
    100% { box-shadow: var(--shadow); border-color: var(--border); }
  }
  .celebration-toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, #4caf7c, #66d08a); color: #fff;
    padding: 10px 28px; border-radius: 30px; font-weight: 700; font-size: 0.9rem;
    z-index: 999; pointer-events: none;
    box-shadow: 0 4px 20px rgba(76,175,124,0.4);
    animation: toastIn 2.5s ease forwards;
  }
  @keyframes toastIn {
    0% { opacity: 0; transform: translateX(-50%) translateY(-30px); }
    15% { opacity: 1; transform: translateX(-50%) translateY(0); }
    70% { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  }
  .particle {
    position: fixed; pointer-events: none; z-index: 999;
    font-size: 1rem; font-weight: 700;
    animation: particleBurst 0.9s cubic-bezier(0,0.6,0.4,1) forwards;
    filter: drop-shadow(0 0 4px var(--glow, gold));
  }
  @keyframes particleBurst {
    0% { opacity: 0; transform: translate(0,0) scale(0.2) rotate(0deg); }
    15% { opacity: 1; transform: translate(calc(var(--px)*0.3),calc(var(--py)*0.3)) scale(1.6) rotate(30deg); }
    50% { opacity: 1; transform: translate(var(--px),var(--py)) scale(1.2) rotate(120deg); }
    100% { opacity: 0; transform: translate(var(--px2),var(--py2)) scale(0.3) rotate(280deg); }
  }

  /* ---- Fridge badge pop ---- */
  .fridge-badge.pop {
    animation: badgePop 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
  }
  @keyframes badgePop {
    0% { transform: scale(0) rotate(-15deg); opacity: 0; }
    60% { transform: scale(1.4) rotate(5deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  /* ---- Diet multi-select hint ---- */
  .diet-hint {
    text-align: center; padding: 0 20px 4px; font-size: 0.68rem; color: #bfb9b0;
  }
  .week-slot__label {
    font-size: 0.63rem; font-weight: 700; color: #a09888; margin-bottom: 2px;
    letter-spacing: 0.5px;
  }
  .week-slot__name { font-size: 0.78rem; color: var(--text); line-height: 1.35; word-break: break-all; }
  .week-slot__empty { font-size: 0.68rem; color: #d0c8b8; font-style: italic; }
  .week-slot__cal { font-size: 0.62rem; color: #b0a090; margin-top: 1px; }

  /* ---- Fridge Panel ---- */
  .fridge-toggle-btn {
    background: #fff; color: #5a8a6a; border: 1.5px solid #b8d8c0;
    position: relative; transition: all 0.2s;
  }
  .fridge-toggle-btn:hover { border-color: #8cc09a; background: #f6fdf8; }
  .fridge-toggle-btn.active { background: #e8f5ea; border-color: #5a9a6a; color: #3d7040; box-shadow: 0 0 0 3px rgba(90,154,106,0.12); }
  .fridge-toggle-btn .badge {
    display: inline-block; background: #e07b3c; color: #fff; font-size: 0.68rem;
    font-weight: 700; min-width: 18px; height: 18px; line-height: 18px;
    border-radius: 9px; text-align: center; margin-left: 3px; padding: 0 5px;
  }
  .fridge-toggle-btn .badge:empty { display: none; }
  .fridge-panel {
    max-width: 1200px; margin: 0 auto; padding: 0 20px 10px;
    max-height: 0; overflow: hidden; transition: max-height 0.4s ease, opacity 0.3s ease; opacity: 0;
  }
  .fridge-panel.open { max-height: 500px; opacity: 1; }
  .fridge-panel-inner { background: #fafaf6; border: 1px solid #e8dfd3; border-radius: var(--radius); padding: 14px 18px; }
  .fridge-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .fridge-panel-header strong { font-size: 0.9rem; color: var(--text); }
  .fridge-actions { display: flex; gap: 8px; }
  .fridge-actions button { font-size: 0.7rem; padding: 3px 12px; border-radius: 20px; border: 1px solid #ddd; background: #fff; cursor: pointer; color: #888; transition: all 0.15s; }
  .fridge-actions button:hover { border-color: #bbb; color: #555; }
  .fridge-cat { margin-bottom: 8px; }
  .fridge-cat-label { font-size: 0.68rem; font-weight: 700; color: #9b8e80; margin-bottom: 3px; }
  .fridge-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .fridge-tag {
    font-size: 0.74rem; padding: 4px 11px; border-radius: 20px; border: 1px solid #e0d8c8;
    background: #fff; cursor: pointer; user-select: none; transition: all 0.18s; color: #6b6058; white-space: nowrap;
  }
  .fridge-tag:hover { border-color: #c0b898; background: #fdfaf3; }
  .fridge-tag.selected { background: #e8f0e2; border-color: #7ab88a; color: #3d6a40; font-weight: 600; }
  .fridge-status { font-size: 0.73rem; color: #9b8e80; margin-top: 8px; text-align: center; min-height: 18px; }
  .fridge-status.match { color: #3d7040; }
  .fridge-status.none { color: #c0a0a0; }

  .footer { text-align: center; padding: 8px 20px 24px; color: #bfb9b0; font-size: 0.74rem; }

  @media (max-width: 900px) {
    .bento-top { grid-template-columns: 1fr; }
    .meals-grid {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto auto;
    }
    #cardMorning { grid-column: 1; grid-row: 1; }
    #cardNoon    { grid-column: 2; grid-row: 1; }
    #cardTreat   { grid-column: 1; grid-row: 2; }
    #cardNight   { grid-column: 2; grid-row: 2; }
  }
  @media (max-width: 768px) {
    .weekly-grid { grid-template-columns: repeat(4, 1fr); }
    .week-col:nth-child(n+5) { margin-top: 8px; }
  }
  @media (max-width: 560px) {
    .header h1 { font-size: 1.4rem; }
    .meals-grid {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
    }
    #cardMorning, #cardNoon, #cardNight, #cardTreat {
      grid-column: 1; grid-row: auto;
    }
    .bento-card { padding: 12px 14px; }
    .weekly-grid { grid-template-columns: repeat(2, 1fr); }
    .flip-front::after { display: none; }
    .flip-back { padding: 10px 12px; }
    .dish-name { font-size: 0.85rem; }
    .diet-pill { font-size: 0.68rem; padding: 4px 9px; }
    .fridge-tag { font-size: 0.68rem; padding: 3px 8px; }
    .btn { font-size: 0.78rem; padding: 7px 14px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>每日饭菜搭配</h1>
  <p class="subtitle">科学搭配三餐，营养均衡每一天</p>
</div>

<div class="bento-wrap">

<!-- 顶部 bento: 饮食模式 + 操作按钮 -->
<div class="bento-top">
  <div class="bento-card">
    <div class="diet-bar" id="dietBar">
      <span class="diet-pill active" data-mode="balanced" onclick="toggleDietMode('balanced', this)">🍽️ 均衡</span>
      <span class="diet-pill" data-mode="lowcal" onclick="toggleDietMode('lowcal', this)">🥗 减脂</span>
      <span class="diet-pill" data-mode="muscle" onclick="toggleDietMode('muscle', this)">💪 增肌</span>

// ===================== 饮食属性引擎 =====================
// 根据菜品名称+详情，计算饮食属性标签

function getDishAttrs(dishName, category) {
  const details = DISH_DETAILS[dishName] || getDishDetailsCompat(dishName, category);
  const name = dishName.toLowerCase();
  const ing = (details?.ingredients || '').toLowerCase();
  const combined = name + ' ' + ing;

  // 纯素检测: 无任何动物性食材
  const animalKW = ['肉','鸡','鸭','鱼','虾','蟹','猪','牛','羊','蛋','奶','鱿鱼','排骨','里脊','五花','猪肝','猪蹄','火腿','腊肉','腊肠','肉末','肉松','鹌鹑','皮蛋','松花蛋','咸蛋黄','奶油','黄油','牛肉','牛腩','牛柳','羊肉','乌鸡','老鸭'];
  let isVegan = true;
  for (const k of animalKW) { if (combined.includes(k)) { isVegan = false; break; } }
  const isVegetarian = isVegan || (combined.includes('蛋') && !combined.includes('肉') && !combined.includes('鱼') && !combined.includes('虾') && !combined.includes('鸡') && !combined.includes('鸭'));

  // 麸质检测: 含小麦/面粉制品
  const glutenKW = ['面','饼','包','饺','馄饨','面包','馒头','花卷','烧麦','油条','吐司','三明治','疙瘩汤','面片','凉皮','河粉','米粉','肠粉','年糕'];
  let hasGluten = false;
  for (const k of glutenKW) { if (name.includes(k)) { hasGluten = true; break; } }
  // 某些含米粉/河粉/肠粉的实际含米浆而非小麦，但大部分面食含麸质
  const riceBased = ['河粉','米粉','肠粉','凉皮','米线','螺蛳粉'];
  for (const k of riceBased) { if (name.includes(k)) hasGluten = false; }

  // 辣度检测
  const spicyKW = ['辣','麻婆','剁椒','水煮','麻辣','干煸','干锅','泡椒','郫县','辣椒','尖椒','避风塘','椒盐'];
  let spicyLevel = 0;
  for (const k of spicyKW) { if (name.includes(k) || ing.includes(k)) { spicyLevel = 2; break; } }
  if (spicyLevel === 0) {
    const mildSpicy = ['蒜蓉','蒜泥','蒜香','孜然','黑椒','咖喱'];
    for (const k of mildSpicy) { if (name.includes(k)) { spicyLevel = 1; break; } }
  }

  // 蛋白质水平
  const proteinKW = ['肉','鸡','鸭','鱼','虾','蟹','牛','羊','蛋','豆腐','豆','鱿鱼','排骨','里脊','牛腩','牛柳','猪肝','虾仁','乌鸡'];
  let proteinScore = 0;
  for (const k of proteinKW) { if (name.includes(k)) proteinScore++; }
  const proteinLevel = proteinScore >= 3 ? 'high' : proteinScore >= 1 ? 'medium' : 'low';

  // 热量提取
  let calPer100g = 150; // default
  const calStr = details?.calories || '';
  const calMatch = calStr.match(/(\d+)\s*千卡/);
  if (calMatch) calPer100g = parseInt(calMatch[1]);
  // 调整至每份估算 (大体*1.5倍)
  const calPerServing = Math.round(calPer100g * 1.4);

  // 减脂友好度: 低卡+高蛋白+蒸/煮/拌
  const lowCal = calPer100g <= 120;
  const healthyCook = name.includes('蒸') || name.includes('煮') || name.includes('拌') || name.includes('灼') || name.includes('清炒') || name.includes('白切');
  const lowFatScore = (lowCal ? 2 : 0) + (proteinLevel === 'high' ? 1 : 0) + (healthyCook ? 1 : 0);

  return { isVegan, isVegetarian, hasGluten, spicyLevel, proteinLevel, calPer100g, calPerServing, lowFatScore };
}

// ===================== 饮食模式过滤 =====================
let dietModes = new Set(['balanced']); // 支持多选: balanced|lowcal|muscle|vegan|glutenfree|nospice|spicy

function toggleDietMode(mode, el) {
  // 互斥处理: 免辣 ↔ 嗜辣
  if (mode === 'nospice' && dietModes.has('spicy')) dietModes.delete('spicy');
  if (mode === 'spicy' && dietModes.has('nospice')) dietModes.delete('nospice');
  // 选择任意特定模式时移除"均衡"
  if (mode !== 'balanced' && dietModes.has('balanced')) dietModes.delete('balanced');
  // 选择"均衡"时清空其他模式
  if (mode === 'balanced') { dietModes.clear(); dietModes.add('balanced'); }
  else {
    // toggle
    if (dietModes.has(mode)) dietModes.delete(mode);
    else dietModes.add(mode);
    // 如果所有模式都被取消，回退到均衡
    if (dietModes.size === 0) dietModes.add('balanced');
  }
  // 更新UI
  document.querySelectorAll('.diet-pill').forEach(p => {
    p.classList.remove('active','active--muscle','active--vegan','active--spicy');
    if (dietModes.has(p.dataset.mode)) {
      p.classList.add('active');
      if (p.dataset.mode==='muscle') p.classList.add('active--muscle');
      if (p.dataset.mode==='vegan') p.classList.add('active--vegan');
      if (p.dataset.mode==='spicy') p.classList.add('active--spicy');
    }
  });
  randomizeAll();
}

function filterByDiet(dishArr, category) {
  if (dietModes.has('balanced') || dietModes.size === 0) return dishArr;
  const filtered = dishArr.filter(dish => {
    const attrs = getDishAttrs(dish.name, category);
    // 所有选中模式必须同时满足 (取交集)
    for (const mode of dietModes) {
      if (mode === 'vegan' && !attrs.isVegan) return false;
      if (mode === 'glutenfree' && attrs.hasGluten) return false;
      if (mode === 'nospice' && attrs.spicyLevel > 0) return false;
      if (mode === 'spicy' && attrs.spicyLevel < 1) return false;
      if (mode === 'lowcal' && attrs.lowFatScore < 2) return false;
      if (mode === 'muscle' && attrs.proteinLevel !== 'high') return false;
    }
    return true;
  });
  if (filtered.length === 0) return dishArr; // 回退
  return filtered;
}

let fridgeSelection = new Set();
let fridgeOpen = false;

function getSelectedFridgeIngredients() { return new Set(fridgeSelection); }

function getDishKeywordTokens(dishName, details) {
  const text = (dishName + ' ' + (details?.ingredients || '')).toLowerCase();
  const matched = [];
  for (const cat of FRIDGE_INGREDIENTS)
    for (const ing of cat.items)
      for (const k of ing.kw)
        if (text.includes(k.toLowerCase())) { matched.push(ing.id); break; }
  return [...new Set(matched)];
}

function computeMatchScore(dishName, details) {
  const tokens = getDishKeywordTokens(dishName, details);
  if (tokens.length === 0) return 0;
  const sel = getSelectedFridgeIngredients();
  if (sel.size === 0) return 0;
  let hit = 0;
  for (const t of tokens) if (sel.has(t)) hit++;
  return hit / Math.max(tokens.length, 1);
}

function filterByFridge(dishArr, category) {
  const sel = getSelectedFridgeIngredients();
  if (sel.size === 0) return null;
  const scored = dishArr.map(d => {
    const details = getDishDetails(d.name, category);
    return { dish: d, score: computeMatchScore(d.name, details) };
  }).filter(s => s.score > 0);
  if (scored.length === 0) return null;
  scored.sort((a,b) => b.score - a.score);
  return scored;
}

function pickFromFridge(dishArr, category) {
  const scored = filterByFridge(dishArr, category);
  if (!scored || scored.length === 0) return null;
  const topN = Math.max(3, Math.ceil(scored.length * 0.8));
  const pool = scored.slice(0, topN);
  return pool[Math.floor(Math.random() * pool.length)].dish;
}

function isFridgeMode() { return fridgeSelection.size > 0; }

function renderFridgeTags() {
  const container = document.getElementById('fridgeTags');
  let html = '';
  for (const cat of FRIDGE_INGREDIENTS) {
    html += `<div class="fridge-cat"><div class="fridge-cat-label">${cat.cat}</div><div class="fridge-tags">`;
    for (const ing of cat.items) {
      const sel = fridgeSelection.has(ing.id) ? ' selected' : '';
      html += `<span class="fridge-tag${sel}" data-id="${ing.id}" onclick="toggleIngredient(this,'${ing.id}')">${ing.label}</span>`;
    }
    html += '</div></div>';
  }
  container.innerHTML = html;
  updateFridgeBadge(); updateFridgeStatus();
}

    el.textContent = '未选择食材，将完全随机抽选';

    let total=0, matchable=0;

      {arr:DISH_DB.lunchMeat,cat:'meat'},{arr:DISH_DB.lunchVeggie,cat:'veggie'},
      {arr:DISH_DB.dinnerVeggie,cat:'veggie'},{arr:DISH_DB.dinnerSoup,cat:'soup'},

// ===================== 综合选菜引擎 (饮食模式 + 冰箱 + 随机) =====================

function smartPick(dishArr, category) {
  // 先做饮食模式过滤
  const dietFiltered = filterByDiet(dishArr, category);

  // 冰箱模式: 加权随机 (70%冰箱匹配, 30%全局)
  if (isFridgeMode()) {
    const scored = filterByFridge(dietFiltered, category);
    if (scored && scored.length > 0) {
      // 70%概率从冰箱匹配中选, 30%从所有饮食过滤中选
      if (Math.random() < 0.7) {
        return weightedPick(scored);
      }
    }
  }
  return pick(dietFiltered);
}

// 加权随机: 匹配度越高的菜品越容易被选中
function weightedPick(scored) {
  const weights = scored.map(s => s.score * s.score); // 平方放大差异
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < scored.length; i++) {
    r -= weights[i];
    if (r <= 0) return scored[i].dish;
  }
  return scored[scored.length - 1].dish;
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ===================== 热量计算 =====================

function estimateCalories(dish) {
  if (!dish) return 0;
  const details = DISH_DETAILS[dish.name] || getDishDetailsCompat(dish.name, '');
  const calStr = details?.calories || '';
  const m = calStr.match(/(\d+)/);
  if (m) return parseInt(m[1]);
  return 150;
}

function computeDailyCalories(dayMenu) {
  let total = 0;
  const items = [
    dayMenu.breakfast,
    dayMenu.lunchMeatItem, dayMenu.lunchVeggieItem, dayMenu.lunchVeggie2Item, dayMenu.lunchStapleItem,
    dayMenu.dinnerVeggieItem, dayMenu.dinnerSoupItem, dayMenu.dinnerStapleItem,
    dayMenu.dessertItem, dayMenu.drinkItem,
  ];
  for (const item of items) {
    if (item && item.name) total += estimateCalories(item);
  }
  return total;
}

function getCalTag(total) {
  if (total <= 900) return '<span class="cal-tag cal-tag--low">低卡</span>';
  if (total <= 1500) return '<span class="cal-tag cal-tag--mid">适中</span>';
  return '<span class="cal-tag cal-tag--high">高卡</span>';
}

function updateCalSummary() {
  const el = document.getElementById('calSummary');
  if (!el) return;
  if (viewMode === 'weekly') {
    el.innerHTML = '';
    return;
  }
  const total = computeDailyCalories(currentDay);
  const tag = getCalTag(total);
  el.innerHTML = `📊 今日预计摄入 <strong>≈ ${total} kcal</strong> ${tag}`;
}

  const menu = {

    lunchStapleItem: smartPick(DISH_DB.lunchStaple, 'staple'),

    dinnerSoupItem: smartPick(DISH_DB.dinnerSoup, 'soup'),
    dinnerStapleItem: smartPick(DISH_DB.dinnerStaple, 'staple'),
  };
  // 午餐模式
  if (lunchMode === 'two-veggie') {
    menu.lunchMeatItem = null;
    menu.lunchVeggie2Item = smartPick(DISH_DB.lunchVeggie, 'veggie');
  } else {
    menu.lunchMeatItem = smartPick(DISH_DB.lunchMeat, 'meat');
    menu.lunchVeggie2Item = null;
  }
  // 甜品饮品
  if (showTreats) {
    menu.dessertItem = smartPick(DISH_DB.desserts, 'dessert');
    menu.drinkItem = smartPick(DISH_DB.drinks, 'drink');
  } else {
    menu.dessertItem = null;
    menu.drinkItem = null;
  }
  return menu;
}

function clearWeek() {

// ===================== 周计划渲染 + 拖拽 =====================

function renderWeek() {
  const grid = document.getElementById('weeklyGrid');
  if (!grid) return;
  const todayIdx = (new Date().getDay() + 6) % 7; // Mon=0 ... Sun=6
  let html = '';
  for (let d = 0; d < 7; d++) {
    const day = weeklyMenu[d];
    const isToday = d === todayIdx;
    html += `<div class="week-col">
      <div class="week-col__header${isToday ? ' today' : ''}">${DAY_LABELS[d]}${isToday ? ' ⭐' : ''}</div>`;
    ['breakfast','lunch','dinner','treat'].forEach((meal, mi) => {
      let items = [];
      if (meal === 'breakfast' && day) {
        items = [{label:'早',name:day.breakfast?.name||'',cal:day.breakfast?estimateCalories(day.breakfast):0}];
      } else if (meal === 'lunch' && day) {
        items = [
          {label:'荤',name:day.lunchMeatItem?.name||'',cal:day.lunchMeatItem?estimateCalories(day.lunchMeatItem):0},
          {label:'素',name:day.lunchVeggieItem?.name||'',cal:day.lunchVeggieItem?estimateCalories(day.lunchVeggieItem):0},
          {label:'主',name:day.lunchStapleItem?.name||'',cal:day.lunchStapleItem?estimateCalories(day.lunchStapleItem):0},
        ];
      } else if (meal === 'dinner' && day) {
        items = [
          {label:'蔬',name:day.dinnerVeggieItem?.name||'',cal:day.dinnerVeggieItem?estimateCalories(day.dinnerVeggieItem):0},
          {label:'汤',name:day.dinnerSoupItem?.name||'',cal:day.dinnerSoupItem?estimateCalories(day.dinnerSoupItem):0},
          {label:'主',name:day.dinnerStapleItem?.name||'',cal:day.dinnerStapleItem?estimateCalories(day.dinnerStapleItem):0},
        ];
      } else if (meal === 'treat' && day) {
        items = [
          {label:'甜',name:day.dessertItem?.name||'',cal:day.dessertItem?estimateCalories(day.dessertItem):0},
          {label:'饮',name:day.drinkItem?.name||'',cal:day.drinkItem?estimateCalories(day.drinkItem):0},
        ];
      }
      if (!day) items = [];
      html += `<div class="week-slot" data-day="${d}" data-meal="${meal}"
        draggable="${items.length>0?'true':'false'}"
        ondragstart="handleDragStart(event,'${d}','${meal}')"
        ondragover="handleDragOver(event)"
        ondragleave="handleDragLeave(event)"
        ondrop="handleDrop(event,'${d}','${meal}')"
        ondblclick="rerollWeekSlot('${d}','${meal}')">`;
      html += `<div class="week-slot__label">${meal==='breakfast'?'🌅 早餐':meal==='lunch'?'☀️ 午饭':meal==='dinner'?'🌙 晚饭':'🍰 甜品饮品'}</div>`;
      if (items.length === 0) {
        html += `<div class="week-slot__empty">— 未生成 —</div>`;
      } else {
        items.forEach(it => {
          html += `<div class="week-slot__name">${it.label?('<b>'+it.label+'</b> '):''}${it.name||'(空)'}</div>`;
          if (it.cal > 0) html += `<div class="week-slot__cal">≈${it.cal}kcal</div>`;
        });
      }
      html += '</div>';
    });
    html += '</div>';
  }
  grid.innerHTML = html;
}

// ---- Drag & Drop ----
let dragData = null;

function handleDragStart(e, day, meal) {
  dragData = { fromDay: parseInt(day), fromMeal: meal };
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', `${day}|${meal}`);
}
function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.target.closest('.week-slot')?.classList.add('drag-over');
}
function handleDragLeave(e) {
  e.target.closest('.week-slot')?.classList.remove('drag-over');
}
function handleDrop(e, toDay, toMeal) {
  e.preventDefault();
  e.target.closest('.week-slot')?.classList.remove('drag-over');
  document.querySelectorAll('.week-slot.dragging').forEach(s => s.classList.remove('dragging'));
  if (!dragData) return;
  const fromDay = dragData.fromDay;
  const fromMeal = dragData.fromMeal;

  // 交换两餐
  const a = cloneMealSlot(weeklyMenu[fromDay], fromMeal);
  const b = cloneMealSlot(weeklyMenu[toDay], toMeal);
  setMealSlot(weeklyMenu[fromDay], fromMeal, b);
  setMealSlot(weeklyMenu[toDay], toMeal, a);
  dragData = null;
  renderWeek();
}

function cloneMealSlot(day, meal) {
  if (!day) return null;
  if (meal === 'breakfast') return { breakfast: day.breakfast ? {...day.breakfast} : null };
  if (meal === 'lunch') return {
    lunchMeatItem: day.lunchMeatItem?{...day.lunchMeatItem}:null,
    lunchVeggieItem: day.lunchVeggieItem?{...day.lunchVeggieItem}:null,
    lunchStapleItem: day.lunchStapleItem?{...day.lunchStapleItem}:null,
  };
  if (meal === 'dinner') return {
    dinnerVeggieItem: day.dinnerVeggieItem?{...day.dinnerVeggieItem}:null,
    dinnerSoupItem: day.dinnerSoupItem?{...day.dinnerSoupItem}:null,
    dinnerStapleItem: day.dinnerStapleItem?{...day.dinnerStapleItem}:null,
  };
  if (meal === 'treat') return {
    dessertItem: day.dessertItem?{...day.dessertItem}:null,
    drinkItem: day.drinkItem?{...day.drinkItem}:null,
  };
  return null;
}

function setMealSlot(day, meal, data) {
  if (!day || !data) return;
  if (meal === 'breakfast') { day.breakfast = data.breakfast; }
  else if (meal === 'lunch') {
    day.lunchMeatItem = data.lunchMeatItem;
    day.lunchVeggieItem = data.lunchVeggieItem;
    day.lunchStapleItem = data.lunchStapleItem;
  } else if (meal === 'dinner') {
    day.dinnerVeggieItem = data.dinnerVeggieItem;
    day.dinnerSoupItem = data.dinnerSoupItem;
    day.dinnerStapleItem = data.dinnerStapleItem;
  } else if (meal === 'treat') {
    day.dessertItem = data.dessertItem;
    day.drinkItem = data.drinkItem;
  }
}

function rerollWeekSlot(day, meal) {
  if (!weeklyMenu[day]) return;
  const newDay = generateDayMenu();
  const slot = cloneMealSlot(newDay, meal);
  setMealSlot(weeklyMenu[day], meal, slot);
  renderWeek();
}

function makeFlipRow(item, category) {
  const details = getDishDetails(item.name, category);
  const cls = item.labelClass || 'dish-label--main';
  const attrs = getDishAttrs(item.name, category);
  // 冰箱匹配检测
  let fridgeBadge = '';
  if (isFridgeMode()) {
    const tokens = getDishKeywordTokens(item.name, details);
    const sel = getSelectedFridgeIngredients();
    let hitCount = 0;
    for (const t of tokens) { if (sel.has(t)) hitCount++; }
    if (hitCount >= 1) {
      fridgeBadge = `<span class="fridge-badge">✨${hitCount}种食材已备</span>`;
    }
  }
  return `
    <div class="flip-row" onclick="toggleFlip(this, event)">
      <div class="flip-inner">
        <div class="flip-front">
          <span class="dish-label ${cls}">${item.label||''}</span>
          <div style="flex:1">
            <div class="dish-name">${item.name}${fridgeBadge}</div>
            ${item.desc?`<div class="dish-desc">${item.desc}</div>`:''}
            <div class="dish-cal-row">🔥 ≈${attrs.calPerServing}kcal/份${attrs.spicyLevel>0?' · 🌶️':''}${attrs.isVegan?' · 🌱':''}${attrs.hasGluten?' · 🌾':''}${attrs.proteinLevel==='high'?' · 💪':''}</div>
          </div>
        </div>
        <div class="flip-back">
          <div class="detail-section"><div class="detail-title" style="color:#d06828">食材配比</div><div class="detail-text">${details.ingredients}</div></div>
          <div class="detail-section"><span class="detail-calories">${details.calories}</span></div>
          <div class="detail-section"><div class="detail-title" style="color:#3d7040">简易步骤</div><div class="detail-steps">${details.steps}</div></div>
          <div class="flip-back-hint">点击空白处翻回 ›</div>
        </div>

}

// ===================== 3D翻转 =====================

function measureBackHeight(backEl, containerWidth) {
  const measurer = document.createElement('div');
  measurer.style.cssText = 'position:fixed;left:-9999px;top:0;visibility:hidden;width:'+containerWidth+'px;font-size:0.82rem;line-height:1.55;padding:12px 14px;font-family:inherit;';
  measurer.innerHTML = backEl.innerHTML;
  document.body.appendChild(measurer);
  const h = measurer.scrollHeight;
  document.body.removeChild(measurer);
  return h;
}

function toggleFlip(row, e) {
  if (e.target.closest('.flip-back')) {
    const inner = row.querySelector('.flip-inner');
    if (inner && inner.classList.contains('flipped')) {
      inner.classList.remove('flipped');
      inner.style.height = '';
      row.style.margin = '';
    }
    return;
  }
  const inner = row.querySelector('.flip-inner');
  if (!inner) return;
  const body = row.closest('.meal-card__body');
  if (body) {
    body.querySelectorAll('.flip-inner.flipped').forEach(other => {
      if (other !== inner) { other.classList.remove('flipped'); other.style.height=''; other.closest('.flip-row').style.margin=''; }
    });
  }
  const isOpening = !inner.classList.contains('flipped');
  if (isOpening) {
    const back = row.querySelector('.flip-back');
    const front = row.querySelector('.flip-front');
    const frontH = front.offsetHeight;
    const rowW = row.offsetWidth;
    const backH = measureBackHeight(back, rowW);
    const clampedBackH = Math.min(backH, 260);
    const targetH = Math.max(frontH, clampedBackH) + 4;
    inner.style.height = targetH + 'px';
    row.style.margin = '10px 0';
    requestAnimationFrame(() => { requestAnimationFrame(() => { inner.classList.add('flipped'); }); });
  } else {
    inner.classList.remove('flipped');
    row.style.margin = '';
    setTimeout(() => { if (!inner.classList.contains('flipped')) inner.style.height = ''; }, 600);
  }
}

// ===================== 转轮老虎机动画 =====================

// 收集可用于滚动的菜名池
function getDishPool(cardId) {
  switch (cardId) {
    case 'cardMorning': return DISH_DB.breakfast.map(d => d.name);
    case 'cardNoon': {
      const meats = DISH_DB.lunchMeat.map(d => '🥩 ' + d.name);
      const veggies = DISH_DB.lunchVeggie.map(d => '🥬 ' + d.name);
      const staples = DISH_DB.lunchStaple.map(d => '🍚 ' + d.name);
      return [...meats, ...veggies, ...staples];
    }
    case 'cardNight': {
      const veggies = DISH_DB.dinnerVeggie.map(d => '🥬 ' + d.name);
      const soups = DISH_DB.dinnerSoup.map(d => '🍲 ' + d.name);
      const staples = DISH_DB.dinnerStaple.map(d => '🍚 ' + d.name);
      return [...veggies, ...soups, ...staples];
    }
    case 'cardTreat': {
      const desserts = DISH_DB.desserts.map(d => '🍰 ' + d.name);
      const drinks = DISH_DB.drinks.map(d => '🥤 ' + d.name);
      return [...desserts, ...drinks];
    }
    default: return ['--'];
  }
}

// 构建滚轮: 30条随机菜名
function buildTrack(cardId, winName) {
  const pool = getDishPool(cardId);
  const items = [];
  for (let i = 0; i < 30; i++) {
    const name = pool[Math.floor(Math.random() * pool.length)];
    items.push(name);
  }
  // 确保最终结果在倒数第3位（停在可见区域中间）
  items[items.length - 3] = winName;
  return items;
}

// 单卡转轮动画
function spinReel(cardId, finalRenderFn, duration) {
  const card = document.getElementById(cardId);
  if (!card) return;
  const body = card.querySelector('.meal-card__body');
  if (!body) return;
  const bodyHeight = body.offsetHeight || 140;

  // 清空 body，创建滚轮舞台
  body.innerHTML = '';
  body.style.position = 'relative';
  body.style.overflow = 'hidden';
  body.style.padding = '0';
  body.style.height = bodyHeight + 'px';

  const stage = document.createElement('div');
  stage.className = 'reel-stage';
  stage.style.height = bodyHeight + 'px';

  const track = document.createElement('div');
  track.className = 'reel-track racing';

  // 最终菜名（去emoji前缀用于匹配）
  const cleanWin = (typeof finalRenderFn._winName === 'string') ? finalRenderFn._winName : '';

  const dishNames = buildTrack(cardId, cleanWin);
  dishNames.forEach((name, i) => {
    const item = document.createElement('div');
    item.className = 'reel-item';
    item.textContent = name;
    if (name === cleanWin) item.classList.add('win');
    track.appendChild(item);
  });

  // 遮罩
  const mask = document.createElement('div');
  mask.className = 'reel-mask';

  stage.appendChild(track);
  stage.appendChild(mask);
  body.appendChild(stage);

  // 计算滚动距离: 每条 ~42px, 滚到目标行
  const itemH = 42;
  const targetIdx = dishNames.length - 5; // 让 win 停在掩膜透明区
  const scrollDist = targetIdx * itemH;

  // 设置高度让 track 能滚动
  track.style.height = (dishNames.length * itemH) + 'px';

  // 启动: 先用 racing (transition:none) 设到顶部
  track.style.transform = 'translateY(0)';
  track.offsetHeight; // force reflow

  // 过渡到目标位置
  requestAnimationFrame(() => {
    track.classList.remove('racing');
    track.style.transform = 'translateY(-' + scrollDist + 'px)';
  });

  // 过渡结束 → 清理并渲染最终结果
  const onEnd = () => {
    track.removeEventListener('transitionend', onEnd);
    body.style.position = '';
    body.style.overflow = '';
    body.style.padding = '';
    body.style.height = '';
    body.innerHTML = '';
    finalRenderFn();
    card.classList.add('settled');
    setTimeout(() => card.classList.remove('settled'), 400);
  };
  track.addEventListener('transitionend', onEnd);

  // 保险: 超时强制结束
  setTimeout(() => {
    if (body.querySelector('.reel-stage')) {
      track.removeEventListener('transitionend', onEnd);
      body.style.position = '';
      body.style.overflow = '';
      body.style.padding = '';
      body.style.height = '';
      body.innerHTML = '';
      finalRenderFn();
      card.classList.add('settled');
      setTimeout(() => card.classList.remove('settled'), 400);
    }
  }, duration + 600);
}

function spinAllReels() {
  const newDay = generateDayMenu();
  let stoppedCount = 0;

  // 四轮同时旋转、同时定格揭晓
  const reels = [
    { id: 'cardMorning', win: newDay.breakfast.name,
      render: () => { currentDay.breakfast = newDay.breakfast; renderFinalCard('cardMorning'); } },
    { id: 'cardNoon', win: lunchMode==='two-veggie' ? newDay.lunchVeggieItem.name : newDay.lunchMeatItem.name,
      render: () => { currentDay.lunchMeatItem = newDay.lunchMeatItem; currentDay.lunchVeggieItem = newDay.lunchVeggieItem; if(newDay.lunchVeggie2Item) currentDay.lunchVeggie2Item = newDay.lunchVeggie2Item; currentDay.lunchStapleItem = newDay.lunchStapleItem; renderFinalCard('cardNoon'); } },
    { id: 'cardNight', win: newDay.dinnerVeggieItem.name,
      render: () => { currentDay.dinnerVeggieItem = newDay.dinnerVeggieItem; currentDay.dinnerSoupItem = newDay.dinnerSoupItem; currentDay.dinnerStapleItem = newDay.dinnerStapleItem; renderFinalCard('cardNight'); } },
  ];
  if (showTreats) {
    reels.push({ id: 'cardTreat', win: newDay.dessertItem.name,
      render: () => { currentDay.dessertItem = newDay.dessertItem; currentDay.drinkItem = newDay.drinkItem; renderFinalCard('cardTreat'); } });
  }
  const total = reels.length;

  reels.forEach(({ id, win, render }) => {
    const fn = () => { render(); stoppedCount++; if (stoppedCount >= total) { setTimeout(() => triggerCelebration(), 300); updateCalSummary(); } };
    fn._winName = win;
    spinReel(id, fn, 3100);
  });
}

// 庆祝特效
function triggerCelebration() {
  // 检查是否命中饮食偏好
  const dietMatch = !dietModes.has('balanced') && dietModes.size > 0;
  // 检查是否有冰箱匹配
  let fridgeMatchCount = 0;
  if (isFridgeMode()) {
    const items = [
      currentDay.breakfast, currentDay.lunchMeatItem, currentDay.lunchVeggieItem, currentDay.lunchVeggie2Item, currentDay.lunchStapleItem,
      currentDay.dinnerVeggieItem, currentDay.dinnerSoupItem, currentDay.dinnerStapleItem,
      currentDay.dessertItem, currentDay.drinkItem,
    ];
    for (const item of items) {
      if (!item || !item.name) continue;
      const details = getDishDetails(item.name, '');
      const tokens = getDishKeywordTokens(item.name, details);
      for (const t of tokens) { if (fridgeSelection.has(t)) { fridgeMatchCount++; break; } }
    }
  }

  // 绿光霓虹边框
  ['cardMorning','cardNoon','cardNight','cardTreat'].forEach(id => {
    const card = document.getElementById(id);
    if (card) {
      card.classList.add('celebrate');
      setTimeout(() => card.classList.remove('celebrate'), 1000);
    }
  });

  // Toast 消息
  const toast = document.createElement('div');
  toast.className = 'celebration-toast';
  let msg = '🎉 今日完美菜单已送达！';
  if (dietMatch) msg = '✨ 完美搭配！符合你的饮食偏好！';
  if (fridgeMatchCount >= 3) msg = '🧊 冰箱清库大师！食材充分利用！';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2600);

  // 冰箱匹配粒子
  if (fridgeMatchCount > 0) {
    setTimeout(() => spawnFridgeParticles(), 400);
  }

  // 弹冰箱badge
  document.querySelectorAll('.fridge-badge').forEach(b => {
    b.classList.add('pop');
    setTimeout(() => b.classList.remove('pop'), 500);
  });
}

function spawnFridgeParticles() {
  const emojis = ['✨','⭐','🌟','💚','❤️','💛','🟢','🔴','🟡','💫','🔥','🎯','💖','🎆','🎇','🧨'];
  const glowColors = ['#4caf7c','#e07b3c','#f0c040','#ff6b8a','#6cd0ff','#c080ff','#ff9060','#ff4080','#40ff80'];
  const cards = ['cardMorning','cardNoon','cardNight','cardTreat'];
  cards.forEach(cardId => {
    const card = document.getElementById(cardId);
    if (!card) return;
    const badges = card.querySelectorAll('.fridge-badge');
    badges.forEach(badge => {
      // 获取 badge 在屏幕上的坐标
      const rect = badge.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;
      // 每个 badge 炸出 12 颗全屏彩色粒子
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('span');
        p.className = 'particle';
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.left = originX + 'px';
        p.style.top = originY + 'px';
        p.style.setProperty('--glow', glowColors[Math.floor(Math.random() * glowColors.length)]);
        const angle = (Math.PI * 2 * i) / 12 + (Math.random() - 0.5) * 0.4;
        const dist = 80 + Math.random() * 160; // 更广的爆炸范围
        p.style.setProperty('--px', Math.cos(angle) * dist * 0.4 + 'px');
        p.style.setProperty('--py', Math.sin(angle) * dist * 0.4 - 40 + 'px');
        p.style.setProperty('--px2', Math.cos(angle) * dist + (Math.random()-0.5)*80 + 'px');
        p.style.setProperty('--py2', Math.sin(angle) * dist - 20 + (Math.random()-0.5)*80 + 'px');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1000);
      }
    });
  });
}

// ===================== 按钮交互 =====================

function randomizeAll() {
  document.querySelectorAll('.flip-inner.flipped').forEach(el => {
    el.classList.remove('flipped'); el.style.height='';
    const r = el.closest('.flip-row'); if(r) r.style.margin='';
  });
  const btn = document.querySelector('.btn-primary');
  if (btn) { btn.style.transform='scale(0.95)'; setTimeout(()=>{btn.style.transform='';},120); }
  spinAllReels();
}

function randomizeMeal(meal) {
  const prefixes = {morning:'cardMorning',noon:'cardNoon',night:'cardNight',treat:'cardTreat'};
  const cardId = prefixes[meal] || 'cardMorning';
  const card = document.getElementById(cardId);
  if (card) card.querySelectorAll('.flip-inner.flipped').forEach(el => {
    el.classList.remove('flipped'); el.style.height='';
    const r=el.closest('.flip-row'); if(r) r.style.margin='';
  });
  if (!currentDay || !currentDay.breakfast) currentDay = generateDayMenu();

  // 选最终结果
  let winName = '';
  const renderFn = () => {
    switch (meal) {
      case 'morning': currentDay.breakfast = pick(DISH_DB.breakfast); break;
      case 'noon':
        if (lunchMode === 'two-veggie') {
          currentDay.lunchMeatItem = null;
          currentDay.lunchVeggieItem = smartPick(DISH_DB.lunchVeggie, 'veggie');
          currentDay.lunchVeggie2Item = smartPick(DISH_DB.lunchVeggie, 'veggie');
        } else {
          currentDay.lunchMeatItem = smartPick(DISH_DB.lunchMeat, 'meat');
          currentDay.lunchVeggieItem = smartPick(DISH_DB.lunchVeggie, 'veggie');
          currentDay.lunchVeggie2Item = null;
        }
        currentDay.lunchStapleItem = smartPick(DISH_DB.lunchStaple, 'staple')
        break;
      case 'night':
        currentDay.dinnerVeggieItem = smartPick(DISH_DB.dinnerVeggie, 'veggie');
        currentDay.dinnerSoupItem = smartPick(DISH_DB.dinnerSoup, 'soup');
        currentDay.dinnerStapleItem = smartPick(DISH_DB.dinnerStaple, 'staple');
        break;
      case 'treat':
        if (showTreats) {
          currentDay.dessertItem = smartPick(DISH_DB.desserts, 'dessert');
          currentDay.drinkItem = smartPick(DISH_DB.drinks, 'drink');
        }
        break;
    }
    renderFinalCard(cardId);
    const c = document.getElementById(cardId);
    if (c) { c.classList.add('settled'); setTimeout(()=>c.classList.remove('settled'),450); }
    updateCalSummary();
  };
  // 确定 win name
  switch (meal) {
    case 'morning': winName = currentDay.breakfast?.name || ''; break;
    case 'noon': winName = lunchMode==='two-veggie' ? (currentDay.lunchVeggieItem?.name||'') : (currentDay.lunchMeatItem?.name||''); break;
    case 'night': winName = currentDay.dinnerVeggieItem?.name || ''; break;
    case 'treat': winName = currentDay.dessertItem?.name || ''; break;
  }
  renderFn._winName = winName;
  spinReel(cardId, renderFn, 800);
}

// ===================== 冰箱消耗 =====================

function consumeFridge() {
  if (!isFridgeMode()) return;
  const usedIngredientIds = new Set();
  const items = [
    currentDay.breakfast,
    currentDay.lunchMeatItem, currentDay.lunchVeggieItem, currentDay.lunchVeggie2Item, currentDay.lunchStapleItem,
    currentDay.dinnerVeggieItem, currentDay.dinnerSoupItem, currentDay.dinnerStapleItem,
    currentDay.dessertItem, currentDay.drinkItem,
  ];
  for (const item of items) {
    if (!item || !item.name) continue;
    const details = getDishDetails(item.name, '');
    const tokens = getDishKeywordTokens(item.name, details);
    for (const t of tokens) {
      if (fridgeSelection.has(t)) usedIngredientIds.add(t);
    }
  }
  if (usedIngredientIds.size === 0) {
    alert('当前菜单中没有用到冰箱中的食材，无需消耗。');
    return;
  }
  for (const id of usedIngredientIds) fridgeSelection.delete(id);
  renderFridgeTags();
  const btn = document.getElementById('fridgeToggle');
  if (btn) {
    btn.style.boxShadow = '0 0 0 6px rgba(90,154,106,0.2)';
    setTimeout(() => { btn.style.boxShadow = ''; }, 800);
  }
}

  const grid = document.getElementById('mealsGrid');
  const cards = [
    { id:'cardMorning', cls:'meal-card--morning', icon:'🌅', title:'早餐 · 营养早餐', hint:'粗粮+蛋白+蔬果' },
    { id:'cardNoon',    cls:'meal-card--noon',    icon:'☀️', title:'午饭 · 一荤一素',   hint:'荤素搭配 + 主食' },
    { id:'cardNight',   cls:'meal-card--night',   icon:'🌙', title:'晚饭 · 一蔬一汤',   hint:'清淡养胃 + 主食' },
    { id:'cardTreat',   cls:'meal-card--treat',   icon:'🍰', title:'甜品 & 饮品',      hint:'一甜一饮 · 锦上添花' },
  ];
  grid.innerHTML = cards.map(c => `
    <div class="meal-card ${c.cls}" id="${c.id}">

      <div class="meal-card__body"></div>
    </div>
  `).join('');
}

currentDay = generateDayMenu();
buildDOM();
renderAll();
</script>
